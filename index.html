<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Invoice Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>AUTOMATED INVOICE GENERATOR</h2>

    <div class="main">

        <div class="form">

            <label>Customer Name</label>
            <input type="text" id="customer">

            <label>Item Name</label>
            <input type="text" id="item">

            <label>Price</label>
            <input type="number" id="price">

            <label>Quantity</label>
            <input type="number" id="qty">

            <button onclick="addItem()">Add Item</button>
            <button onclick="generateInvoice()">Generate Invoice</button>
            <button onclick="saveInvoice()">Save Invoice</button>
            <button onclick="resetInvoice()">Reset</button>

            <div class="delete-section">
                <label>Edit / Delete Item:</label>
                <select id="deleteItemSelect">
                    <option value="">-- Select Item --</option>
                </select>

                <div style="margin-top:5px;">
                    Change Qty: 
                    <input type="number" id="changeQty" placeholder="0">
                </div>

                <div class="qtyBtns">
                    <button onclick="addQty()">+ Qty</button>
                    <button onclick="subtractQty()">- Qty</button>
                    <button onclick="deleteSelectedItem()">Delete Item</button>
                </div>
            </div>

        </div>

        <div class="invoice">
            <div id="invoiceBox"></div>
            <button onclick="printInvoice()">Print Invoice</button>

            <div class="salesBox">
                Total Sales: ₱ <span id="totalSales">0</span>
            </div>

            <div class="history">
                <b>Invoice History</b>
                <div id="historyList"></div>
            </div>
        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
